<section class="min-h-screen bg-slate-50 p-6">
  <div
    class="mb-6 flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Districts</h1>

      <p class="mt-2 text-slate-500">Manage and view all districts in the system.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <div
      class="p-6 rounded-2xl border border-slate-200 bg-white shadow-sm hover:shadow-md transition"
    >
      <div class="flex items-center gap-4">
        <div class="p-4 rounded-xl bg-blue-50">
          <mat-icon class="text-blue-600">map</mat-icon>
        </div>

        <div>
          <p class="text-sm text-slate-500 font-medium">State</p>

          <h3 class="text-2xl font-bold text-slate-800">1</h3>
        </div>
      </div>
    </div>

    <div
      class="p-6 rounded-2xl border border-slate-200 bg-white shadow-sm hover:shadow-md transition"
    >
      <div class="flex items-center gap-4">
        <div class="p-4 rounded-xl bg-blue-50">
          <mat-icon class="text-blue-600">location_on</mat-icon>
        </div>

        <div>
          <p class="text-sm text-slate-500 font-medium">Districts</p>

          <h3 class="text-2xl font-bold text-slate-800">33</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <mat-form-field appearance="outline" class="w-full md:w-[450px]">
      <mat-label>Search District</mat-label>

      <mat-icon matPrefix>search</mat-icon>

      <input
        matInput
        (keyup)="searchDistrict($event)"
        placeholder="Search by District ID or Name"
        #input
      />
    </mat-form-field>
  </div>

  <mat-card class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 bg-gray-300 px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">District List</h2>
      </div>

      <button
        mat-flat-button
        (click)="openDialog()"
        class="!h-11 !rounded-xl !bg-blue-600 !px-5 !font-semibold !text-white hover:!bg-blue-700"
      >
        <mat-icon>add</mat-icon>

        Add District
      </button>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="w-full !bg-white">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            DISTRICT ID
          </th>

          <td
            mat-cell
            *matCellDef="let element; let i = index"
            class="py-5 font-medium text-slate-700"
          >
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            DISTRICT NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.name | titlecase }}
          </td>
        </ng-container>

        <ng-container matColumnDef="stateId">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            STATE NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.stateId.name | titlecase }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">ACTIONS</th>

          <td mat-cell *matCellDef="let element" class="py-4">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              class="rounded-lg hover:bg-slate-100"
            >
              <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="deleteDistrict(element._id)">
                <mat-icon class="!text-red-500">delete</mat-icon>

                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-50"></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="hover:bg-slate-50 transition"
        ></tr>

        <tr *matNoDataRow>
          <td colspan="4" class="py-10 text-center text-slate-500">
            <div class="flex flex-col items-center gap-3">
              <mat-icon class="text-slate-300" style="width: 48px; height: 48px; font-size: 48px">
                inbox
              </mat-icon>

              <span class="font-medium"> No district records found </span>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      class="border-t border-slate-200 bg-white"
      [pageSizeOptions]="[5, 10, 20]"
      [pageSize]="limit"
      [length]="total"
      [pageIndex]="page - 1"
      (page)="changePage($event)"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card>
</section>
