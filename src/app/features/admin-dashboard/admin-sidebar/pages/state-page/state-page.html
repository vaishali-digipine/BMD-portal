<section class="min-h-screen bg-slate-50 p-6">
  <div
    class="mb-6 flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <h1 class="text-3xl font-bold text-slate-800">States</h1>

      <p class="mt-2 text-slate-500">Manage and view all states in the system.</p>
    </div>
  </div>

  <div class="mb-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <mat-form-field appearance="outline" class="w-full md:w-[450px]">
      <mat-label>Search State</mat-label>

      <mat-icon matPrefix>search</mat-icon>

      <input matInput (keyup)="applyFilter($event)" placeholder="Search by State Name" #input />
    </mat-form-field>
  </div>

  <mat-card class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 bg-gray-300 px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">State List</h2>
      </div>

      <button
        mat-flat-button
        (click)="openDialog()"
        class="!h-11 !rounded-xl !bg-blue-600 !px-5 !font-semibold !text-white hover:!bg-blue-700"
      >
        <mat-icon>add</mat-icon>

        Add State
      </button>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="w-full !bg-white">
        <ng-container matColumnDef="stateId">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">STATE ID</th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.stateId }}
          </td>
        </ng-container>

        <ng-container matColumnDef="stateName">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            STATE NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.stateName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">ACTIONS</th>

          <td mat-cell *matCellDef="let element" class="py-4">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              class="rounded-lg hover:bg-slate-100"
            >
              <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon class="!text-red-500"> delete </mat-icon>

                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-50"></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="hover:bg-slate-50 transition-colors duration-200"
        ></tr>

        <tr *matNoDataRow>
          <td colspan="3" class="py-10 text-center text-slate-500">
            <div class="flex flex-col items-center gap-3">
              <mat-icon class="text-slate-300" style="font-size: 48px; width: 48px; height: 48px">
                inbox
              </mat-icon>

              <span class="font-medium"> No state records found </span>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      class="border-t border-slate-200 bg-white"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Select page"
    >
    </mat-paginator>
  </mat-card>
</section>
