<section class="p-6 bg-slate-50 min-h-screen">
  <div
    class="mb-6 flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Departments</h1>

      <p class="mt-2 text-slate-500">Manage and view all department in the system.</p>
    </div>
  </div>

  <div class="mb-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <mat-form-field appearance="outline" class="w-full md:w-[450px]">
      <mat-label>Search Department</mat-label>

      <mat-icon matPrefix>search</mat-icon>

      <input matInput (keyup)="applyFilter($event)" placeholder="Search by State Name" #input />
    </mat-form-field>
  </div>

  <mat-card class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 bg-gray-300 px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Departments List</h2>
      </div>

      <button
        mat-flat-button
        (click)="openDialog()"
        class="!h-11 !rounded-xl !bg-blue-600 !px-5 !font-semibold !text-white hover:!bg-blue-700"
      >
        <mat-icon>add</mat-icon>

        Add Department
      </button>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="w-full !bg-white">
        <ng-container matColumnDef="departmentId">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            DEPARTMENT ID
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.departmentId }}
          </td>
        </ng-container>

        <ng-container matColumnDef="departmentName">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            DEPARTMENT NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.departmentName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">ACTIONS</th>

          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon class="!text-red-500">delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-100"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-slate-50"></tr>

        <tr *matNoDataRow>
          <td colspan="6" class="text-center py-8 text-slate-500">No clerk records found</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      class="border-t border-slate-200 bg-white"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card>
</section>
