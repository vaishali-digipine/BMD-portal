<section class="p-6 bg-slate-50 min-h-screen">
  <div
    class="mb-6 flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Holidays</h1>

      <p class="mt-2 text-slate-500">Manage and view all holidays in the system.</p>
    </div>
  </div>

  <mat-card class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 bg-gray-300 px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Holidays List</h2>
      </div>

      <button
        mat-flat-button
        (click)="openDialog()"
        class="!h-11 !rounded-xl !bg-blue-600 !px-5 !font-semibold !text-white hover:!bg-blue-700"
      >
        <mat-icon>add</mat-icon>

        Add Holiday
      </button>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="w-full !bg-white">
        <ng-container matColumnDef="serialNo">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">SR. NO.</th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.serialNo }}
          </td>
        </ng-container>

        <ng-container matColumnDef="holidayName">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            HOLIDAY NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.holidayName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">DATE</th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.date }}
          </td>
        </ng-container>

        <ng-container matColumnDef="year">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">YEAR</th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.year }}
          </td>
        </ng-container>

        <ng-container matColumnDef="nationalHoliday">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            NATIONAL HOLIDAY
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.nationalHoliday }}
          </td>
        </ng-container>

        <ng-container matColumnDef="office">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">
            OFFICE NAME
          </th>

          <td mat-cell *matCellDef="let element" class="py-5 font-medium text-slate-700">
            {{ element.office }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="!text-sm !font-bold text-black">ACTIONS</th>

          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon class="!text-red-500">delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-100"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-slate-50"></tr>

        <tr *matNoDataRow>
          <td colspan="6" class="text-center py-8 text-slate-500">No clerk records found</td>
        </tr>
      </table>
    </div>
    <mat-paginator
      class="border-t border-slate-200 bg-white"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card>
</section>
