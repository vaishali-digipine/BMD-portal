<section>
  <div class="flex justify-center items-center mt-15">
    <div class="p-6 w-[500px]">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-blue-700">Add State</h1>
      </div>

      <form [formGroup]="addState">
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>State</mat-label>
          <input matInput type="text" formControlName="stateName" />
          <mat-error>Enter the Valid State</mat-error>
        </mat-form-field>

        <div class="flex justify-between mt-6">
          <button
            mat-raised-button
            class="!px-6 !py-6 !rounded-xl !font-semibold !text-lg !border !border-blue-600 !text-white !bg-blue-600"
            (click)="closeDialog()"
          >
            Add
          </button>
          <button
            mat-raised-button
            class="!px-6 !py-6 !rounded-xl !font-semibold !text-lg !border !border-red-600 !text-white !bg-red-600"
            (click)="closeDialog()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
