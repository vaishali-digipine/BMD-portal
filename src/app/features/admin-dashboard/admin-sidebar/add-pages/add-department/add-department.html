<section>
  <div class="flex justify-center items-center mt-15">
    <div class="p-6 w-[500px]">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-blue-700">Add Departments</h1>
      </div>

      <form [formGroup]="addDepartment">
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>Departments</mat-label>
          <mat-select>
            @for (department of departments; track department) {
              <mat-option [value]="department.value">{{ department.viewValue }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="flex justify-between mt-6">
          <button
            mat-raised-button
            class="!px-6 !py-6 !rounded-xl !font-semibold !text-lg !border !border-blue-600 !text-white !bg-blue-600"
            (click)="closeDialog()"
          >
            Add
          </button>
          <button
            mat-raised-button
            class="!px-6 !py-6 !rounded-xl !font-semibold !text-lg !border !border-red-600 !text-white !bg-red-600"
            (click)="closeDialog()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
