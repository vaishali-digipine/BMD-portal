<mat-sidenav-container class="h-screen w-full bg-slate-50">
  <mat-sidenav mode="side" opened class="!w-[280px] !bg-white border-r border-slate-200">
    <div class="flex flex-col h-screen">
      <div class="border-b border-slate-200 py-4 px-5">
        <div class="flex justify-center">
          <img src="/assets/images/logo.png" class="h-20 object-contain" alt="Logo" />
        </div>

        <h2 class="text-center text-lg font-semibold text-slate-800 mt-2">Admin Portal</h2>

        <p class="text-center text-sm text-slate-500">Official Service Management</p>
      </div>

      <div class="flex-1 px-4 py-3">
        <nav class="space-y-1">
          <a
            routerLink="admin-homepage"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>

          <a
            routerLink="clerk-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>support_agent</mat-icon>
            <span>Clerk</span>
          </a>

          <a
            routerLink="user-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>group</mat-icon>
            <span>Users</span>
          </a>

          <a
            routerLink="state-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>map</mat-icon>
            <span>States</span>
          </a>

          <a
            routerLink="district-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>location_on</mat-icon>
            <span>Districts</span>
          </a>

          <a
            routerLink="office-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>business</mat-icon>
            <span>Offices</span>
          </a>

          <a
            routerLink="department-page"
            class="flex items-center! font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>apartment</mat-icon>
            <span>Departments</span>
          </a>

          <a
            routerLink="holiday-page"
            class="flex items-center !font-extrabold text-lg gap-4 h-11 px-4 rounded-xl text-slate-700 hover:bg-blue-50 transition"
          >
            <mat-icon>celebration</mat-icon>
            <span>Holidays</span>
          </a>
        </nav>
      </div>

      <!-- Logout -->
      <div class="border-t border-slate-200 p-4">
        <button
          mat-raised-button
          class="!w-full !bg-blue-700 hover:!bg-blue-500 !text-white !rounded-xl !py-2 !font-bold !shadow-md flex items-center justify-center gap-2"
        >
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </div>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="bg-slate-50 p-8">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
