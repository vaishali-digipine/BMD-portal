<nav
  class="fixed top-0 left-0 z-50 w-full flex items-center justify-between px-8 py-3 bg-white/90 backdrop-blur-md border-b border-slate-200"
>
  <a routerLink="/" class="flex items-center">
    <img src="/assets/images/logo.png" alt="BMD-portal Logo" class="h-20 w-auto object-contain" />
  </a>

  <button matButton="filled" routerLink="/">Home</button>
</nav>

<section class="pt-24">
  <div class="min-h-screen flex justify-center items-center mt-0 pb-20">
    <mat-card class="w-full max-w-md p-8 rounded-2xl shadow-lg bg-gray-400">
      <div class="text-center mb-6">
        <mat-icon class="text-5xl w-12 h-12 text-blue-600"> lock_reset </mat-icon>

        <h1 class="text-3xl font-bold text-slate-800 mt-3">Reset Password</h1>

        <p class="text-gray-500 mt-2">Create a new password for your account.</p>
      </div>

      <form [formGroup]="resetPasswordForm" class="flex flex-col gap-4">
        <app-password-field
          label="New Password"
          [passwordControl]="resetPasswordForm.controls.password"
        ></app-password-field>

        <app-password-field
          label="Confirm Password"
          [passwordControl]="resetPasswordForm.controls.confirmPassword"
        ></app-password-field>

        @if (
          resetPasswordForm.value.password !== resetPasswordForm.value.confirmPassword &&
          resetPasswordForm.controls.confirmPassword.touched
        ) {
          <p class="text-red-600 text-sm">Password and Confirm Password do not match.</p>
        }
        <button matButton="filled" type="submit" class="w-full mt-2" (click)="onsubmit()">
          Reset Password
        </button>

        <a routerLink="/SignIn" class="text-center text-blue-600 hover:underline mt-2">
          Back to Login
        </a>
      </form>
    </mat-card>
  </div>
</section>
