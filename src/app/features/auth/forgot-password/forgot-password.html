<nav
  class="fixed top-0 left-0 z-50 w-full flex items-center justify-between px-8 py-3 bg-white/90 backdrop-blur-md border-b border-slate-200"
>
  <a routerLink="/" class="flex items-center">
    <img src="/assets/images/logo.png" alt="BMD-portal Logo" class="h-20 w-auto object-contain" />
  </a>

  <button matButton="filled" routerLink="/">Home</button>
</nav>

<section class="pt-24">
  <div class="min-h-screen flex justify-center items-center mt-0 pb-35">
    <mat-card class="w-full max-w-md p-8 rounded-2xl shadow-lg bg-gray-400">
      <div class="text-center mb-6">
        <mat-icon class="text-5xl w-12 h-12 text-blue-600"> lock_reset </mat-icon>

        <p class="text-gray-500 mt-2">For reset new password enter your valid email.</p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <app-email-field [emailControl]="forgotPasswordForm.controls.email"></app-email-field>

        <button matButton="filled" type="submit" class="w-full mt-2" [disabled]="loading">
          @if (loading) {
            Sending...
          } @else {
            Send Email
          }
        </button>

        @if (showOtp) {
          <h2 class="block text-sm font-semibold text-slate-700 mb-1">Enter valid OTP:</h2>

          <div class="flex items-center gap-3 mb-4">
            <div class="flex justify-center items-center mb-3">
              @for (control of otpControls; track $index) {
                <mat-form-field
                  appearance="outline"
                  class="w-16 h-16 text-extrabold text-center p-1"
                >
                  <input matInput maxlength="1" [formControl]="control" class="text-center" />
                </mat-form-field>
              }
            </div>
          </div>
          <button
            matButton="filled"
            class="!bg-success !text-white !px-6 !py-6"
            type="button"
            (click)="verifyForgotPassword()"
          >
            Verify
          </button>
        }
      </form>
    </mat-card>
  </div>
</section>
