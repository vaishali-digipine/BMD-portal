<mat-form-field appearance="fill" class="w-full">
  <mat-label>{{ label }} </mat-label>

  <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="passwordControl" />

  <button matIconButton matSuffix type="button" (click)="hide.set(!hide())">
    <mat-icon>
      {{ hide() ? 'visibility_off' : 'visibility' }}
    </mat-icon>
  </button>

  @if (passwordControl.hasError('required') && passwordControl.touched) {
    <mat-error>Password is required.</mat-error>
  }

  @if (
    (passwordControl.hasError('minlength') || passwordControl.hasError('maxlength')) &&
    passwordControl.touched
  ) {
    <mat-error> Password must be between 8 and 20 characters long. </mat-error>
  }
</mat-form-field>
